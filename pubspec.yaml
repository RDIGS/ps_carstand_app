name: ps_carstand_app
description: PS CarStand — gestão de stands automóvel.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Rede
  dio: ^5.7.0

  # Sessão local encriptada (token do stand guardado 1x, secção 4)
  flutter_secure_storage: ^9.2.2

  # Câmara (captura DUA) e seleção de imagem
  image_picker: ^1.1.2

  # Abrir anúncios reais da estimativa de mercado no browser (cartão de estimativa)
  url_launcher: ^6.3.0

  # Id gerado no cliente para POST /vehicles/:id/confirm (idempotência, secção 5/11)
  uuid: ^4.5.1

  # Gráficos do dashboard financeiro (secção 12.5 — "não só tabelas")
  fl_chart: ^0.69.0

  # Versão instalada da app, para /app/version-check (secção 22)
  package_info_plus: ^8.1.2

  # Banner de venda: partilhar/guardar a imagem gerada e localizar a pasta
  # de transferências no Windows.
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Seletor de cor livre no banner de venda (mantém a liberdade de escolha
  # que já existia no protótipo HTML fornecido pelo utilizador).
  flutter_colorpicker: ^1.1.0

  # i18n (secção 18) — texto da interface vive em lib/l10n/*.arb, nunca no código
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # gera lib/l10n/app_localizations.dart a partir de lib/l10n/*.arb (flutter pub get)
  assets:
    - assets/images/app_icon.png
    - assets/images/logo_horizontal.png
